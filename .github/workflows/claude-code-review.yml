# Reviews each ready PR once with Anthropic's code-review plugin and posts inline comments.
# The plugin skips PRs Claude already commented on; ask "@claude" in the PR for follow-ups.
name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  review:
    # Drafts and bot PRs are skipped, and so are fork PRs, which get no secrets.
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      # Workaround for anthropics/claude-code-action#1901: the API answers "Credit balance is too low" to every request
      # tagged with the action's CLAUDE_CODE_ENTRYPOINT, so Claude Code runs through a wrapper that drops it.
      - name: Install Claude Code without the action entrypoint
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s 2.1.299
          printf '#!/bin/sh\nexport -p > "$RUNNER_TEMP/claude-env.sh"\nprintf "%%s\\n" "$@" | grep "^--" > "$RUNNER_TEMP/claude-flags"\nunset CLAUDE_CODE_ENTRYPOINT\nexec "%s" "$@"\n' "$HOME/.local/bin/claude" > "$RUNNER_TEMP/claude"
          chmod +x "$RUNNER_TEMP/claude"
      - uses: anthropics/claude-code-action@v1
        with:
          path_to_claude_code_executable: ${{ runner.temp }}/claude
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Agents that ask for opus, sonnet or haiku all resolve to Haiku 5.5, so every run stays on Haiku.
          settings: '{"env": {"ANTHROPIC_DEFAULT_OPUS_MODEL": "claude-haiku-5-5", "ANTHROPIC_DEFAULT_SONNET_MODEL": "claude-haiku-5-5", "ANTHROPIC_DEFAULT_HAIKU_MODEL": "claude-haiku-5-5"}}'
          # --allowedTools must name the inline-comment tool, or the action never starts its MCP server.
          claude_args: |
            --model claude-haiku-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
      # TEMPORARY: prints the API error the action hides. Remove once the failure is diagnosed.
      - if: failure()
        run: |
          jq -c '(if type == "array" then .[] else . end) | select(.type == "result") | {subtype, is_error, api_error_status, errors, result: ((.result // "") | tostring | .[0:400])}' "$RUNNER_TEMP/claude-execution-output.json"
      # TEMPORARY: replays the action's exact env with claude -p, removing one suspect at a time.
      - if: failure()
        run: |
          echo "flags: $(tr '\n' ' ' < "$RUNNER_TEMP/claude-flags")"
          echo "empty vars: $(sh -c '. "$RUNNER_TEMP/claude-env.sh"; env' | sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=$/\1/p' | tr '\n' ' ')"
          probe() {
            label=$1; shift
            sh -c '. "$RUNNER_TEMP/claude-env.sh"; for v in "$@"; do unset "$v"; done; cd "$GITHUB_WORKSPACE"; exec "$HOME/.local/bin/claude" -p "Reply with OK" --model claude-haiku-5-5 --output-format json' probe "$@" \
              | jq -c --arg label "$label" '{probe: $label, is_error, result: ((.result // "") | .[0:100])}' || echo "{\"probe\": \"$label\", \"crashed\": true}"
          }
          probe "action env"
          probe "minus entrypoint" CLAUDE_CODE_ENTRYPOINT
          empties=$(sh -c '. "$RUNNER_TEMP/claude-env.sh"; env' | sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=$/\1/p')
          probe "minus all empty vars" $empties
          for v in $empties; do case $v in ANTHROPIC_*|CLAUDE_*) probe "minus $v" "$v";; esac; done
